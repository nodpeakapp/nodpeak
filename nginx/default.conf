# ─────────────────────────────────────────────────────────────
#  Nodpeak reverse proxy
#  $DOMAIN is substituted from .env at container start.
# ─────────────────────────────────────────────────────────────

upstream nodpeak_app {
    server app:3000;
    keepalive 32;
}

proxy_cache_path /var/cache/nginx/nodpeak levels=1:2 keys_zone=nodpeak_cache:10m
                 max_size=200m inactive=10m use_temp_path=off;

gzip              on;
gzip_vary         on;
gzip_comp_level   6;
gzip_min_length   256;
gzip_proxied      any;
gzip_types        text/plain text/css text/javascript application/javascript
                  application/json application/ld+json application/xml
                  image/svg+xml font/woff font/woff2;

# ── HTTP: ACME challenge + redirect ──────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name ${DOMAIN};

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ${DOMAIN};

    ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 2m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ── The embed script. Public, cached, CORS-open. ─────────
    # Third-party sites load this cross-origin, so it must not
    # inherit the dashboard's restrictive headers.
    location = /widget.js {
        proxy_pass         http://nodpeak_app/widget.js;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   Connection "";

        proxy_cache            nodpeak_cache;
        proxy_cache_valid      200 10m;
        proxy_cache_use_stale  error timeout updating http_500 http_502 http_503 http_504;
        add_header             X-Cache-Status $upstream_cache_status;

        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Cache-Control "public, max-age=600, stale-while-revalidate=3600" always;
        types { } default_type "application/javascript; charset=utf-8";
    }

    # ── Public API consumed by the widget from any origin ────
    location /api/v1/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  "*";
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type";
            add_header Access-Control-Max-Age       86400;
            add_header Content-Length 0;
            return 204;
        }

        proxy_pass         http://nodpeak_app;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection         "";

        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type" always;
    }

    # ── Immutable Next build assets ──────────────────────────
    location /_next/static/ {
        proxy_pass         http://nodpeak_app;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   Connection "";
        add_header         Cache-Control "public, max-age=31536000, immutable";
    }

    # ── Dashboard, auth, webhooks — same-origin only ─────────
    location / {
        proxy_pass         http://nodpeak_app;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $http_upgrade;
        proxy_read_timeout 60s;
    }
}
